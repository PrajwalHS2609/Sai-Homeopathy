<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="eyeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#EEF2FB"/>
    </linearGradient>
    <linearGradient id="irisBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="retinaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="deepEyeNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#1E2559"/>
    </linearGradient>
    <filter id="eyeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#eyeBg)"/>
  <circle cx="500" cy="120" r="180" fill="#BAE6FD" opacity="0.4"/>
  <circle cx="90" cy="680" r="210" fill="#E0F2FE" opacity="0.5"/>

  <!-- Top Specialty Badge -->
  <g transform="translate(50, 45)">
    <rect width="500" height="42" rx="21" fill="#FFFFFF" filter="url(#eyeShadow)"/>
    <circle cx="28" cy="21" r="9" fill="#0284C7"/>
    <path d="M25 21 L27 23 L31 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="46" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0369A1" letter-spacing="1.5">
      OPHTHALMIC &amp; OCULAR WELLNESS
    </text>
  </g>

  <!-- Main Illustration Board -->
  <g transform="translate(50, 115)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF" filter="url(#eyeShadow)"/>
    <rect x="20" y="20" width="460" height="480" rx="22" fill="url(#eyeBg)"/>

    <!-- Concentric Ocular Focus Rings -->
    <circle cx="250" cy="220" r="170" stroke="#BAE6FD" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <circle cx="250" cy="220" r="130" stroke="#7DD3FC" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="220" r="75" fill="#FFFFFF" filter="url(#eyeShadow)"/>

    <!-- Anatomical Human Eye & Optical Rays Illustration -->
    <g transform="translate(250, 220)">
      <!-- Eye Almond Contour (Eyelids) -->
      <path d="M-110 0 C-65 -65 65 -65 110 0 C65 65 -65 65 -110 0 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="4.5" filter="url(#eyeShadow)"/>

      <!-- Sclera Details -->
      <circle cx="0" cy="0" r="54" fill="#F0F9FF"/>

      <!-- Iris Pattern with Radial Striations -->
      <circle cx="0" cy="0" r="42" fill="url(#irisBlue)"/>
      <circle cx="0" cy="0" r="32" fill="#0369A1" opacity="0.8"/>
      
      <!-- Pupil & Luminous Catchlight -->
      <circle cx="0" cy="0" r="18" fill="#0C4A6E"/>
      <circle cx="-6" cy="-6" r="6" fill="#FFFFFF"/>
      <circle cx="6" cy="6" r="2.5" fill="#BAE6FD"/>

      <!-- Tear Film Hydration Wave Lines -->
      <path d="M-90 10 Q0 35 90 10" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
      <path d="M-75 -15 Q0 -35 75 -15" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>

      <!-- Vision Rays -->
      <line x1="-130" y1="0" x2="-115" y2="0" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
      <line x1="115" y1="0" x2="130" y2="0" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 4 Specialized Pillars -->
    <!-- Conjunctivitis -->
    <g transform="translate(95, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#eyeShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F0F9FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#0369A1" text-anchor="middle">CONJUNCTI-</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0284C7" text-anchor="middle">VITIS</text>
    </g>

    <!-- Elevated IOP (Eye Pressure) -->
    <g transform="translate(405, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#eyeShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F0F9FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0369A1" text-anchor="middle">EYE</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0284C7" text-anchor="middle">PRESSURE</text>
    </g>

    <!-- Glaucoma Co-Care -->
    <g transform="translate(95, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#eyeShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F0F9FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0369A1" text-anchor="middle">GLAUCOMA</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0284C7" text-anchor="middle">CARE</text>
    </g>

    <!-- Dry Eye & Digital Strain -->
    <g transform="translate(405, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#eyeShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F0F9FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0369A1" text-anchor="middle">DIGITAL</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0284C7" text-anchor="middle">STRAIN</text>
    </g>

    <!-- Treatment Highlights Box -->
    <g transform="translate(40, 400)">
      <rect width="420" height="80" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
      <text x="210" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E2559" text-anchor="middle">
        Internal Constitutional Ocular Therapeutics
      </text>
      <text x="210" y="47" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">
        Soothe Mucosal Allergy • Aqueous Dynamics Balance • Oral Prescribing
      </text>
      <text x="210" y="67" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0284C7" text-anchor="middle">
        ✓ Euphrasia • Ruta • Argentum Nit • Physostigma • Gelsemium
      </text>
    </g>
  </g>

  <!-- Bottom Quality Strip -->
  <g transform="translate(50, 655)">
    <rect width="500" height="95" rx="20" fill="url(#deepEyeNavy)" filter="url(#eyeShadow)"/>
    <text x="40" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
      Safe Non-Irritating Eye Wellness
    </text>
    <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#BAE6FD">
      Internal Homeopathic Administration • Never Drops into the Eye
    </text>
    <text x="40" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7DD3FC">
      ★ Tonometry Oversight • Optic Nerve Microvascular Support
    </text>
  </g>
</svg>
