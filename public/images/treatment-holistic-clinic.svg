<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FB"/>
      <stop offset="50%" stop-color="#F4F7FD"/>
      <stop offset="100%" stop-color="#EDF8EE"/>
    </linearGradient>
    <linearGradient id="clinicNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2559"/>
      <stop offset="100%" stop-color="#303A88"/>
    </linearGradient>
    <linearGradient id="clinicGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45AC4B"/>
      <stop offset="100%" stop-color="#2F8335"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E2559" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#clinicBg)"/>
  <circle cx="480" cy="100" r="150" fill="#E2E8F0" opacity="0.4"/>
  <circle cx="100" cy="500" r="160" fill="#DCFCE7" opacity="0.4"/>

  <!-- Main Clinical Board -->
  <g transform="translate(40, 40)">
    <rect width="520" height="520" rx="28" fill="#FFFFFF" filter="url(#cShadow)"/>
    <rect x="20" y="20" width="480" height="480" rx="22" fill="url(#clinicBg)"/>

    <!-- Concentric Healing Rings -->
    <circle cx="260" cy="220" r="160" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <circle cx="260" cy="220" r="120" stroke="#86EFAC" stroke-width="2" fill="none"/>
    <circle cx="260" cy="220" r="75" fill="#FFFFFF" filter="url(#cShadow)"/>

    <!-- Homeopathic Healing Emblem: Mortar & Pestle, Stethoscope, Botanical Leaf -->
    <g transform="translate(260, 220)">
      <!-- Stethoscope Tube Loop -->
      <path d="M-65 -40 C-85 10 -65 70 0 75 C65 70 85 10 65 -40" stroke="#303A88" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="75" r="12" fill="#45AC4B"/>
      <circle cx="0" cy="75" r="6" fill="#FFFFFF"/>

      <!-- Mortar Bowl -->
      <path d="M-45 -10 C-45 35 45 35 45 -10 Z" fill="url(#clinicNavy)"/>
      <ellipse cx="0" cy="-10" rx="45" ry="10" fill="#475569"/>
      <!-- Pestle -->
      <path d="M-15 -45 L15 10" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round"/>

      <!-- Botanical Healing Leaf -->
      <path d="M0 -75 C25 -95 50 -75 40 -45 C30 -20 10 -35 0 -75 Z" fill="url(#clinicGreen)"/>
      <path d="M0 -75 C-25 -95 -50 -75 -40 -45 C-30 -20 -10 -35 0 -75 Z" fill="url(#clinicGreen)"/>
    </g>

    <!-- Clinic Title & Badges Below -->
    <g transform="translate(40, 410)">
      <rect width="440" height="75" rx="16" fill="#FFFFFF" stroke="#D8E1F5" stroke-width="1.5"/>
      <text x="220" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E2559" text-anchor="middle">
        Anjali Homeo Clinic &amp; Holistic Healthcare
      </text>
      <text x="220" y="48" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">
        Personalized Constitutional Prescribing • 8 Specialized Care Disciplines
      </text>
      <text x="220" y="66" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#45AC4B" text-anchor="middle">
        ✓ 12,500+ Patients Treated • Online Video &amp; In-Clinic Consultations
      </text>
    </g>
  </g>
</svg>
