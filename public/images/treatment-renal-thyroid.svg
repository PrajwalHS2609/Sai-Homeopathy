  <!-- Bottom Quality Strip -->
  <g transform="translate(50, 655)">
    <rect width="500" height="95" rx="20" fill="url(#deepRoyal)" filter="url(#rtShadow)"/>
    <text x="40" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
      Non-Invasive Renal &amp; Endocrine Care
    </text>
    <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#D8E1F5">
      Spasmolytic Relief and Urinary Tract Cleansing
    </text>
    <text x="40" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">
      ★ Ultrasound Monitored • Renal Safe • No Synthetic Diuretics
    </text>
  </g>
</svg>
