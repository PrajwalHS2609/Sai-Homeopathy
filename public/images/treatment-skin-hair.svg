<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#EEF2FB"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="deepIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2559"/>
      <stop offset="100%" stop-color="#303A88"/>
    </linearGradient>
    <filter id="skinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#D97706" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#skinBg)"/>
  <circle cx="500" cy="120" r="180" fill="#FDE68A" opacity="0.4"/>
  <circle cx="90" cy="680" r="210" fill="#FEF08A" opacity="0.4"/>

  <!-- Top Specialty Badge -->
  <g transform="translate(50, 45)">
    <rect width="500" height="42" rx="21" fill="#FFFFFF" filter="url(#skinShadow)"/>
    <circle cx="28" cy="21" r="9" fill="#F59E0B"/>
    <path d="M25 21 L27 23 L31 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="46" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#B45309" letter-spacing="1.5">
      SKIN, HAIR &amp; SCALP DERMATOLOGY
    </text>
  </g>

  <!-- Main Illustration Board -->
  <g transform="translate(50, 115)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF" filter="url(#skinShadow)"/>
    <rect x="20" y="20" width="460" height="480" rx="22" fill="url(#skinBg)"/>

    <!-- Concentric Dermal Barrier Renewal Rings -->
    <circle cx="250" cy="220" r="170" stroke="#FDE68A" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <circle cx="250" cy="220" r="130" stroke="#FBBF24" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="220" r="75" fill="#FFFFFF" filter="url(#skinShadow)"/>

    <!-- Dermal Cross-Section & Hair Follicle Regeneration Illustration -->
    <g transform="translate(250, 220)">
      <!-- Skin Layer Strata Lines -->
      <path d="M-90 -45 Q-45 -55 0 -45 T90 -45" stroke="#F59E0B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M-90 -30 Q-45 -40 0 -30 T90 -30" stroke="#FCD34D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      
      <!-- Central Hair Follicle Root & Bulb -->
      <path d="M-8 80 C-15 80 -18 60 -10 30 L-4 -45 C-4 -65 0 -95 10 -115" stroke="#B45309" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M8 80 C15 80 18 60 10 30 L4 -45 C4 -65 0 -95 -10 -115" stroke="#D97706" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <!-- Follicle Bulb Glow -->
      <ellipse cx="0" cy="78" rx="14" ry="12" fill="url(#amberGold)"/>
      <circle cx="0" cy="78" r="6" fill="#FFFBEB"/>

      <!-- Botanical Dermal Restoration Leaf Motifs -->
      <path d="M0 -30 C-25 -50 -45 -40 -35 -15 C-25 -2 -5 -15 0 -30 Z" fill="url(#emeraldLeaf)" opacity="0.9"/>
      <path d="M0 -30 C25 -50 45 -40 35 -15 C25 -2 5 -15 0 -30 Z" fill="url(#emeraldLeaf)" opacity="0.9"/>

      <!-- Cellular Renewal Sparkles -->
      <circle cx="-55" cy="20" r="4" fill="#F59E0B"/>
      <circle cx="55" cy="20" r="4" fill="#F59E0B"/>
      <circle cx="-65" cy="-20" r="3" fill="#D97706"/>
      <circle cx="65" cy="-20" r="3" fill="#D97706"/>
    </g>

    <!-- 4 Specialized Dermatology Pillars -->
    <!-- Eczema & Psoriasis -->
    <g transform="translate(95, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#skinShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FFFBEB"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B45309" text-anchor="middle">ECZEMA &amp;</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#D97706" text-anchor="middle">PSORIASIS</text>
    </g>

    <!-- Alopecia & Hair Fall -->
    <g transform="translate(405, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#skinShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FFFBEB"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#B45309" text-anchor="middle">ALOPECIA</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#D97706" text-anchor="middle">HAIR CARE</text>
    </g>

    <!-- Acne & Melasma -->
    <g transform="translate(95, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#skinShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FFFBEB"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#B45309" text-anchor="middle">ACNE &amp;</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#D97706" text-anchor="middle">MELASMA</text>
    </g>

    <!-- Urticaria & Ringworm -->
    <g transform="translate(405, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#skinShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FFFBEB"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#B45309" text-anchor="middle">HIVES &amp;</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#D97706" text-anchor="middle">ALLERGIES</text>
    </g>

    <!-- Treatment Highlights Box -->
    <g transform="translate(40, 400)">
      <rect width="420" height="80" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
      <text x="210" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E2559" text-anchor="middle">
        Non-Steroidal Skin &amp; Trichology Protocols
      </text>
      <text x="210" y="47" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">
        Epidermal Barrier Healing • Follicular Nourishment • Non-Suppressive
      </text>
      <text x="210" y="67" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="middle">
        ✓ Graphites • Sulphur • Silicea • Thuja • Arsenic Album
      </text>
    </g>
  </g>

  <!-- Bottom Quality Strip -->
  <g transform="translate(50, 655)">
    <rect width="500" height="95" rx="20" fill="url(#deepIndigo)" filter="url(#skinShadow)"/>
    <text x="40" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
      Gentle Dermal &amp; Scalp Restoration
    </text>
    <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#D8E1F5">
      Addressing Internal Immune Imbalance rather than Surface Suppression
    </text>
    <text x="40" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">
      ★ Zero Steroid Thinning • Safe for Long-Term Constitutional Recovery
    </text>
  </g>
</svg>
