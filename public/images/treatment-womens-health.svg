<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="whBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#EEF2FB"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="softPlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#303A88"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#831843" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#whBg)"/>
  
  <!-- Subtle organic decorative shapes -->
  <circle cx="500" cy="120" r="180" fill="#FFE4E6" opacity="0.6"/>
  <circle cx="100" cy="700" r="220" fill="#FCE7F3" opacity="0.5"/>
  <circle cx="520" cy="650" r="160" fill="#EEF2FB" opacity="0.8"/>

  <!-- Clinical Treatment Badge Top -->
  <g transform="translate(50, 45)">
    <rect width="500" height="42" rx="21" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="28" cy="21" r="9" fill="#E11D48"/>
    <path d="M25 21 L27 23 L31 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="46" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#831843" letter-spacing="1.5">
      WOMEN'S HEALTH &amp; GYNECOLOGICAL CARE
    </text>
  </g>

  <!-- Central Clinical Illustration Card -->
  <g transform="translate(50, 115)">
    <!-- Main Art Board -->
    <rect width="500" height="520" rx="28" fill="#FFFFFF" filter="url(#softShadow)"/>
    
    <!-- Inner Ambient Panel -->
    <rect x="20" y="20" width="460" height="480" rx="22" fill="url(#whBg)"/>

    <!-- Decorative Concentric Rings for Hormonal Cycles -->
    <circle cx="250" cy="230" r="180" stroke="#FCE7F3" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <circle cx="250" cy="230" r="140" stroke="#FECDD3" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="230" r="105" stroke="#FDA4AF" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
    <circle cx="250" cy="230" r="75" fill="#FFFFFF" filter="url(#softShadow)"/>

    <!-- Central Symbol: Elegant Lotus / Blooming Floral Feminine Icon -->
    <g transform="translate(250, 230)">
      <!-- Outer Petals -->
      <path d="M0 -50 C25 -25 45 0 0 35 C-45 0 -25 -25 0 -50 Z" fill="url(#roseGlow)" opacity="0.95"/>
      <path d="M-10 -40 C-40 -15 -50 15 -10 32 C-20 10 -20 -10 -10 -40 Z" fill="#F43F5E" opacity="0.85"/>
      <path d="M10 -40 C40 -15 50 15 10 32 C20 10 20 -10 10 -40 Z" fill="#F43F5E" opacity="0.85"/>
      <path d="M-25 -25 C-60 0 -55 30 -15 35 C-30 20 -30 0 -25 -25 Z" fill="#FB7185" opacity="0.75"/>
      <path d="M25 -25 C60 0 55 30 15 35 C30 20 30 0 25 -25 Z" fill="#FB7185" opacity="0.75"/>
      <!-- Inner Stamen Glow -->
      <circle cx="0" cy="15" r="7" fill="url(#goldAccent)"/>
    </g>

    <!-- Medical Cross Badge Emblem -->
    <g transform="translate(250, 85)">
      <circle cx="0" cy="0" r="22" fill="#FFFFFF" filter="url(#softShadow)"/>
      <rect x="-3" y="-12" width="6" height="24" rx="3" fill="#E11D48"/>
      <rect x="-12" y="-3" width="24" height="6" rx="3" fill="#E11D48"/>
    </g>

    <!-- 4 Clinical Pillars Surrounding Nodes -->
    <!-- Node 1: PCOD / PCOS Balance -->
    <g transform="translate(100, 160)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#softShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FFF1F2"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#E11D48" text-anchor="middle">PCOD</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#831843" text-anchor="middle">BALANCE</text>
    </g>

    <!-- Node 2: Thyroid & Hormonal Rhythm -->
    <g transform="translate(400, 160)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#softShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FDF2F8"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#BE185D" text-anchor="middle">HORMONAL</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#831843" text-anchor="middle">RHYTHM</text>
    </g>

    <!-- Node 3: Uterine & Ovarian Health -->
    <g transform="translate(100, 310)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#softShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FFF1F2"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#E11D48" text-anchor="middle">FIBROID</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#831843" text-anchor="middle">CARE</text>
    </g>

    <!-- Node 4: Natural Fertility Support -->
    <g transform="translate(400, 310)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#softShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#FDF2F8"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#BE185D" text-anchor="middle">FERTILITY</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#831843" text-anchor="middle">SUPPORT</text>
    </g>

    <!-- Treatment Highlights Banner Inside Card -->
    <g transform="translate(40, 395)">
      <rect width="420" height="85" rx="16" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
      <text x="210" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E2559" text-anchor="middle">
        Constitutional Homeopathic Protocols
      </text>
      <text x="210" y="48" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">
        Gentle Menstrual Regulation • Ovarian Cyst Relief • Non-Hormonal
      </text>
      <text x="210" y="68" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#E11D48" text-anchor="middle">
        ✓ Pulsatilla • Sepia • Calcarea Carb • Folliculinum Support
      </text>
    </g>
  </g>

  <!-- Bottom Quality Strip -->
  <g transform="translate(50, 655)">
    <rect width="500" height="95" rx="20" fill="url(#softPlum)" filter="url(#softShadow)"/>
    <text x="40" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
      Evidence-Informed Gynecological Care
    </text>
    <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#FCE7F3">
      10+ Years Specialized Experience • Holistic Endocrine Support
    </text>
    <text x="40" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F472B6">
      ★ Zero Synthetic Hormones • Certified Medical Supervision
    </text>
  </g>
</svg>
