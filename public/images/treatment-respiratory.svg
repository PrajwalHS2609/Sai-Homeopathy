<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="respBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#EEF2FB"/>
    </linearGradient>
    <linearGradient id="airTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="freshGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45AC4B"/>
      <stop offset="100%" stop-color="#2F8335"/>
    </linearGradient>
    <linearGradient id="deepNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2559"/>
      <stop offset="100%" stop-color="#303A88"/>
    </linearGradient>
    <filter id="respShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#respBg)"/>
  
  <circle cx="500" cy="120" r="180" fill="#CCFBF1" opacity="0.6"/>
  <circle cx="90" cy="680" r="210" fill="#D1FAE5" opacity="0.5"/>

  <!-- Top Specialty Badge -->
  <g transform="translate(50, 45)">
    <rect width="500" height="42" rx="21" fill="#FFFFFF" filter="url(#respShadow)"/>
    <circle cx="28" cy="21" r="9" fill="#0D9488"/>
    <path d="M25 21 L27 23 L31 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="46" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46" letter-spacing="1.5">
      RESPIRATORY, ENT &amp; ALLERGY CARE
    </text>
  </g>

  <!-- Main Illustration Board -->
  <g transform="translate(50, 115)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF" filter="url(#respShadow)"/>
    <rect x="20" y="20" width="460" height="480" rx="22" fill="url(#respBg)"/>

    <!-- Concentric Airway Oxygenation Rings -->
    <circle cx="250" cy="220" r="170" stroke="#A7F3D0" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <circle cx="250" cy="220" r="130" stroke="#6EE7B7" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="220" r="75" fill="#FFFFFF" filter="url(#respShadow)"/>

    <!-- Bronchial Tree & Lungs Anatomy Illustration -->
    <g transform="translate(250, 220)">
      <!-- Trachea / Airway Windpipe -->
      <path d="M0 -75 L0 -25" stroke="#0D9488" stroke-width="8" stroke-linecap="round"/>
      <path d="M-6 -65 L6 -65 M-6 -50 L6 -50 M-6 -35 L6 -35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Primary Bronchi Bifurcation -->
      <path d="M0 -25 C-15 -10 -40 5 -55 25" stroke="#0D9488" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M0 -25 C15 -10 40 5 55 25" stroke="#0D9488" stroke-width="6" stroke-linecap="round" fill="none"/>

      <!-- Left Lung Silhouette (Lobe Contour) -->
      <path d="M-15 -35 C-75 -35 -105 10 -80 75 C-60 115 -25 90 -10 60 C-5 30 -5 -10 -15 -35 Z" fill="url(#airTeal)" opacity="0.85"/>
      <!-- Right Lung Silhouette -->
      <path d="M15 -35 C75 -35 105 10 80 75 C60 115 25 90 10 60 C5 30 5 -10 15 -35 Z" fill="url(#airTeal)" opacity="0.85"/>

      <!-- Bronchial Branching Arbors inside Lungs -->
      <path d="M-50 25 C-65 40 -70 65 -65 80 M-50 25 C-40 45 -40 70 -45 85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M50 25 C65 40 70 65 65 80 M50 25 C40 45 40 70 45 85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>

      <!-- Alveoli Oxygen Bubbles -->
      <circle cx="-65" cy="80" r="4.5" fill="#F0FDF4"/>
      <circle cx="-45" cy="85" r="4.5" fill="#F0FDF4"/>
      <circle cx="65" cy="80" r="4.5" fill="#F0FDF4"/>
      <circle cx="45" cy="85" r="4.5" fill="#F0FDF4"/>

      <!-- Pure Air Circulation Waves -->
      <path d="M-85 -10 C-65 -25 -35 -25 0 -15 C35 -5 65 -5 85 -20" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="5 5"/>
    </g>

    <!-- 4 Specialized Airway Pillars -->
    <!-- Sinusitis & Rhinitis -->
    <g transform="translate(95, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#respShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#ECFDF5"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#065F46" text-anchor="middle">SINUS</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0D9488" text-anchor="middle">RELIEF</text>
    </g>

    <!-- Bronchial Asthma -->
    <g transform="translate(405, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#respShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#ECFDF5"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#065F46" text-anchor="middle">ASTHMA</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0D9488" text-anchor="middle">CONTROL</text>
    </g>

    <!-- Tonsillitis & Adenoids -->
    <g transform="translate(95, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#respShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#ECFDF5"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#065F46" text-anchor="middle">ADENOIDS</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0D9488" text-anchor="middle">&amp; TONSILS</text>
    </g>

    <!-- Allergy Desensitization -->
    <g transform="translate(405, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#respShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#ECFDF5"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#065F46" text-anchor="middle">ALLERGY</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0D9488" text-anchor="middle">IMMUNITY</text>
    </g>

    <!-- Treatment Highlights Box -->
    <g transform="translate(40, 400)">
      <rect width="420" height="80" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
      <text x="210" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E2559" text-anchor="middle">
        Constitutional Airway &amp; ENT Protocols
      </text>
      <text x="210" y="47" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">
        Clear Phlegm • Reduce Inhaler Dependence • Non-Drowsy
      </text>
      <text x="210" y="67" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0D9488" text-anchor="middle">
        ✓ Arsenic Alb • Drosera • Hepar Sulph • Blatta Orientalis
      </text>
    </g>
  </g>

  <!-- Bottom Quality Strip -->
  <g transform="translate(50, 655)">
    <rect width="500" height="95" rx="20" fill="url(#deepNavy)" filter="url(#respShadow)"/>
    <text x="40" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
      Specialized Airway Immunology
    </text>
    <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#D8E1F5">
      Targeting Bronchial Hyper-Reactivity at Root Cause
    </text>
    <text x="40" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">
      ★ Zero Steroid Rebound • Child &amp; Elderly Safe Formulations
    </text>
  </g>
</svg>
