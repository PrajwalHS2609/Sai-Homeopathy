<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Magenta Room -->
    <linearGradient id="roomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0025"/>
      <stop offset="40%" stop-color="#2D0017"/>
      <stop offset="100%" stop-color="#14000A"/>
    </linearGradient>

    <!-- Neon Pink Glow for Title & Anatomy -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFD1E6"/>
      <stop offset="70%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>

    <!-- Uterus & Ovaries Holographic Glow Gradient -->
    <linearGradient id="organGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>

    <linearGradient id="follicleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>

    <!-- Floor Glow Gradient -->
    <radialGradient id="floorLight" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#FF1493" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#880e4f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14000A" stop-opacity="0"/>
    </radialGradient>

    <!-- Window Light Beam Gradient -->
    <linearGradient id="windowBeam" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#C2185B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2D0017" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FF1493" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#FF4081" flood-opacity="0.7"/>
    </filter>

    <filter id="follicleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#roomBg)"/>

  <!-- Left Window & Sunlight Beam -->
  <g opacity="0.6">
    <!-- Window frame -->
    <rect x="30" y="80" width="180" height="420" rx="4" fill="none" stroke="#FF80AB" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="30" y1="220" x2="210" y2="220" stroke="#FF80AB" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="30" y1="360" x2="210" y2="360" stroke="#FF80AB" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="120" y1="80" x2="120" y2="500" stroke="#FF80AB" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Light Beam across room -->
    <polygon points="30,80 210,500 550,675 0,675 0,200" fill="url(#windowBeam)"/>
    
    <!-- Window curtains subtle draping -->
    <path d="M20,60 Q45,260 25,520 Q55,260 40,60" fill="#FF80AB" fill-opacity="0.2"/>
    <path d="M220,60 Q195,260 215,520 Q185,260 200,60" fill="#FF80AB" fill-opacity="0.2"/>
  </g>

  <!-- Room Interior Elements (Right background clinic trolley & anatomy chart) -->
  <g opacity="0.35" transform="translate(950, 160)">
    <!-- Anatomy Poster on Wall -->
    <rect x="20" y="0" width="140" height="180" rx="4" fill="#3A051C" stroke="#FF80AB" stroke-width="1.5"/>
    <line x1="40" y1="30" x2="140" y2="30" stroke="#FF80AB" stroke-width="2"/>
    <circle cx="90" cy="80" r="28" fill="none" stroke="#FF80AB" stroke-width="1.5"/>
    <circle cx="65" cy="80" r="10" fill="none" stroke="#FF80AB" stroke-width="1"/>
    <circle cx="115" cy="80" r="10" fill="none" stroke="#FF80AB" stroke-width="1"/>
    
    <!-- Clinic Trolley Cart -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="170" height="120" rx="6" fill="#200010" stroke="#FF4081" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="170" y2="40" stroke="#FF4081" stroke-width="1"/>
      <line x1="0" y1="80" x2="170" y2="80" stroke="#FF4081" stroke-width="1"/>
      <!-- Small bottles / jars -->
      <rect x="20" y="-18" width="18" height="18" rx="2" fill="#FF80AB" fill-opacity="0.4"/>
      <rect x="45" y="-24" width="22" height="24" rx="2" fill="#FF80AB" fill-opacity="0.4"/>
      <rect x="75" y="-16" width="16" height="16" rx="2" fill="#FF80AB" fill-opacity="0.4"/>
      <!-- Wheels -->
      <circle cx="20" cy="130" r="8" fill="none" stroke="#FF80AB" stroke-width="2"/>
      <circle cx="150" cy="130" r="8" fill="none" stroke="#FF80AB" stroke-width="2"/>
    </g>
  </g>

  <!-- Ground Floor Ambient Radial Reflection -->
  <ellipse cx="600" cy="620" rx="550" ry="85" fill="url(#floorLight)"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#FF4081" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Holographic Female Anatomy Wings & Aura (Behind Patient) -->
  <g transform="translate(600, 360)">
    <!-- Soft Background Hologram Halo -->
    <ellipse cx="0" cy="0" rx="360" ry="170" fill="#FF1493" fill-opacity="0.15" filter="url(#neonBlur)"/>
    <ellipse cx="0" cy="0" rx="280" ry="130" fill="none" stroke="#FF80AB" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 4"/>

    <!-- Left Fallopian Tube & Wing -->
    <path d="M-50,-20 C-110,-90 -220,-80 -270,-10 C-310,50 -260,110 -200,90" 
          fill="none" stroke="#FF4081" stroke-width="7" stroke-linecap="round" filter="url(#neonBlur)"/>
    <path d="M-50,-20 C-110,-90 -220,-80 -270,-10 C-310,50 -260,110 -200,90" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Fallopian Tube & Wing -->
    <path d="M50,-20 C110,-90 220,-80 270,-10 C310,50 260,110 200,90" 
          fill="none" stroke="#FF4081" stroke-width="7" stroke-linecap="round" filter="url(#neonBlur)"/>
    <path d="M50,-20 C110,-90 220,-80 270,-10 C310,50 260,110 200,90" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Central Pear-shaped Uterus Outline -->
    <path d="M-50,-20 C-60,-50 60,-50 50,-20 C45,30 20,80 0,95 C-20,80 -45,30 -50,-20 Z" 
          fill="url(#organGlow)" fill-opacity="0.5" stroke="#FF80AB" stroke-width="3" filter="url(#neonBlur)"/>
    <path d="M-30,-15 C-35,-35 35,-35 30,-15 C25,20 15,50 0,65 C-15,50 -25,20 -30,-15 Z" 
          fill="#FFFFFF" fill-opacity="0.25"/>

    <!-- LEFT POLYCYSTIC OVARY (Enlarged cluster with multiple cystic follicles) -->
    <g transform="translate(-230, 40)">
      <!-- Main Ovary Body -->
      <circle cx="0" cy="0" r="52" fill="url(#organGlow)" fill-opacity="0.65" stroke="#FFFFFF" stroke-width="2.5" filter="url(#neonBlur)"/>
      <circle cx="0" cy="0" r="44" fill="#FF1493" fill-opacity="0.4"/>
      
      <!-- Multiple Immature Follicles / Cysts (Pearl necklace appearance) -->
      <circle cx="-24" cy="-18" r="13" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="4" cy="-28" r="12" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="28" cy="-14" r="14" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="30" cy="18" r="13" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="8" cy="28" r="14" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="-22" cy="18" r="12" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="2" cy="0" r="11" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      
      <!-- Sparkling Micro-dots -->
      <circle cx="-10" cy="-35" r="2.5" fill="#FFFFFF"/>
      <circle cx="36" cy="-2" r="2" fill="#FFFFFF"/>
      <circle cx="-16" cy="34" r="2" fill="#FFFFFF"/>
    </g>

    <!-- RIGHT POLYCYSTIC OVARY (Enlarged cluster with multiple cystic follicles) -->
    <g transform="translate(230, 40)">
      <!-- Main Ovary Body -->
      <circle cx="0" cy="0" r="52" fill="url(#organGlow)" fill-opacity="0.65" stroke="#FFFFFF" stroke-width="2.5" filter="url(#neonBlur)"/>
      <circle cx="0" cy="0" r="44" fill="#FF1493" fill-opacity="0.4"/>
      
      <!-- Multiple Immature Follicles / Cysts -->
      <circle cx="-24" cy="-18" r="13" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="4" cy="-28" r="12" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="28" cy="-14" r="14" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="30" cy="18" r="13" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="8" cy="28" r="14" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="-22" cy="18" r="12" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>
      <circle cx="2" cy="0" r="11" fill="url(#follicleGlow)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#follicleShadow)"/>

      <!-- Sparkling Micro-dots -->
      <circle cx="10" cy="-35" r="2.5" fill="#FFFFFF"/>
      <circle cx="-36" cy="-2" r="2" fill="#FFFFFF"/>
      <circle cx="16" cy="34" r="2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Central Silhouette of Patient (Kneeling, holding lower abdomen with distress) -->
  <g transform="translate(600, 370)">
    <!-- Shadow beneath figure -->
    <ellipse cx="-10" cy="225" rx="110" ry="22" fill="#000000" fill-opacity="0.7"/>

    <!-- Head & Hair (Inclined downward in discomfort) -->
    <ellipse cx="-20" cy="35" rx="24" ry="28" fill="#4A1024" transform="rotate(18 -20 35)"/>
    <path d="M-45,20 Q-15,-5 0,25 Q15,65 -10,95 Q-40,80 -45,20 Z" fill="#200510"/>
    <circle cx="-16" cy="38" r="18" fill="#F0A8B8"/> <!-- Face tone -->

    <!-- Neck & Shoulders -->
    <path d="M-22,50 L-10,75 L-40,80 Z" fill="#E898A8"/>

    <!-- Torso in Burgundy Dress (Curved forward holding belly) -->
    <path d="M-35,75 C-10,70 15,80 20,105 C25,130 15,160 -5,185 C-30,195 -60,185 -65,150 C-70,120 -55,85 -35,75 Z" 
          fill="#6B1336" stroke="#8E1B48" stroke-width="2"/>

    <!-- Folded Arms & Hands clutching lower abdomen -->
    <!-- Upper Arm -->
    <path d="M-40,80 C-60,105 -55,135 -30,150" stroke="#E898A8" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M10,90 C5,115 -10,140 -25,155" stroke="#E898A8" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Hands clutching abdomen -->
    <ellipse cx="-22" cy="155" rx="14" ry="10" fill="#F0A8B8" transform="rotate(-15 -22 155)"/>

    <!-- Kneeling Legs & Dress Hem -->
    <path d="M-65,165 C-80,185 -70,225 -40,225 C-15,225 35,225 45,220 C50,210 35,185 0,180 Z" 
          fill="#520E28"/>
    <!-- Kneeling Knees on Floor -->
    <ellipse cx="-35" cy="225" rx="26" ry="12" fill="#E898A8"/>
    <ellipse cx="20" cy="222" rx="24" ry="11" fill="#E898A8"/>
    
    <!-- Delicate rim lighting from magenta glow on patient's back -->
    <path d="M18,95 C24,120 18,155 -2,180" stroke="#FF80AB" stroke-width="3" fill="none" opacity="0.8"/>
  </g>

  <!-- TOP HERO TYPOGRAPHY (Matching Exact Image Wording & Font Weight) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Main Glowing Header "PCOD" -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="115" 
          font-weight="900" 
          letter-spacing="4"
          fill="url(#neonPink)" 
          filter="url(#textGlow)">
      PCOD
    </text>

    <!-- Sub-heading "Explained:" -->
    <text x="0" y="55" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="1"
          fill="#FFFFFF" 
          filter="url(#textGlow)">
      Explained:
    </text>

    <!-- Detailed Subtitle "Symptoms, Causes, Diagnosis and Treatment Options" -->
    <text x="0" y="105" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="600" 
          letter-spacing="0.5"
          fill="#FFFFFF"
          filter="url(#textGlow)">
      Symptoms, Causes, Diagnosis and Treatment Options
    </text>
  </g>

  <!-- Subtle Top Vignette -->
  <rect width="1200" height="80" fill="url(#roomBg)" opacity="0.3"/>
</svg>
