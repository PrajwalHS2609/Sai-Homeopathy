<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="neuroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#EEF2FB"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="deepAmethyst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="neuroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6D28D9" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#neuroBg)"/>
  <circle cx="500" cy="120" r="180" fill="#DDD6FE" opacity="0.4"/>
  <circle cx="90" cy="680" r="210" fill="#EDE9FE" opacity="0.5"/>

  <!-- Top Specialty Badge -->
  <g transform="translate(50, 45)">
    <rect width="500" height="42" rx="21" fill="#FFFFFF" filter="url(#neuroShadow)"/>
    <circle cx="28" cy="21" r="9" fill="#8B5CF6"/>
    <path d="M25 21 L27 23 L31 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="46" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#5B21B6" letter-spacing="1.5">
      NEUROLOGICAL &amp; HEADACHE CONDITIONS
    </text>
  </g>

  <!-- Main Illustration Board -->
  <g transform="translate(50, 115)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF" filter="url(#neuroShadow)"/>
    <rect x="20" y="20" width="460" height="480" rx="22" fill="url(#neuroBg)"/>

    <!-- Concentric Neural Synapse Rings -->
    <circle cx="250" cy="220" r="170" stroke="#DDD6FE" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <circle cx="250" cy="220" r="130" stroke="#C4B5FD" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="220" r="75" fill="#FFFFFF" filter="url(#neuroShadow)"/>

    <!-- Brain Hemisphere & Neural Synapses Illustration -->
    <g transform="translate(250, 220)">
      <!-- Left Brain Hemisphere -->
      <path d="M-5 -65 C-45 -65 -75 -40 -70 -10 C-75 15 -60 45 -45 55 C-30 65 -15 65 -5 60 Z" fill="url(#violetGlow)" opacity="0.9"/>
      <!-- Right Brain Hemisphere -->
      <path d="M5 -65 C45 -65 75 -40 70 -10 C75 15 60 45 45 55 C30 65 15 65 5 60 Z" fill="url(#violetGlow)" opacity="0.9"/>

      <!-- Cerebral Cortex Convolutions / Sulci -->
      <path d="M-40 -40 C-25 -30 -30 -10 -45 0 C-60 10 -40 30 -25 35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M40 -40 C25 -30 30 -10 45 0 C60 10 40 30 25 35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>

      <!-- Synaptic Impulse Glow Network -->
      <line x1="-50" y1="-20" x2="-80" y2="-40" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-80" cy="-40" r="5" fill="#A78BFA"/>
      
      <line x1="50" y1="-20" x2="80" y2="-40" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="80" cy="-40" r="5" fill="#A78BFA"/>

      <line x1="-40" y1="40" x2="-75" y2="60" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-75" cy="60" r="5" fill="#A78BFA"/>

      <line x1="40" y1="40" x2="75" y2="60" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="75" cy="60" r="5" fill="#A78BFA"/>

      <!-- Central Calm Energy Core -->
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="6" fill="#8B5CF6"/>
    </g>

    <!-- 4 Specialized Pillars -->
    <!-- Migraine Relief -->
    <g transform="translate(95, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#neuroShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F5F3FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#5B21B6" text-anchor="middle">CHRONIC</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#8B5CF6" text-anchor="middle">MIGRAINES</text>
    </g>

    <!-- Tension Headaches -->
    <g transform="translate(405, 150)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#neuroShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F5F3FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#5B21B6" text-anchor="middle">TENSION</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#8B5CF6" text-anchor="middle">HEADACHES</text>
    </g>

    <!-- ADHD & Focus in Children -->
    <g transform="translate(95, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#neuroShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F5F3FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#5B21B6" text-anchor="middle">ADHD &amp;</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#8B5CF6" text-anchor="middle">ATTENTION</text>
    </g>

    <!-- Memory & Mental Balance -->
    <g transform="translate(405, 320)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" filter="url(#neuroShadow)"/>
      <circle cx="0" cy="0" r="28" fill="#F5F3FF"/>
      <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#5B21B6" text-anchor="middle">MEMORY &amp;</text>
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#8B5CF6" text-anchor="middle">WELLNESS</text>
    </g>

    <!-- Treatment Highlights Box -->
    <g transform="translate(40, 400)">
      <rect width="420" height="80" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
      <text x="210" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E2559" text-anchor="middle">
        Neuro-Vascular Desensitization Protocols
      </text>
      <text x="210" y="47" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#475569" text-anchor="middle">
        Calm Trigeminal Hyper-Excitability • Non-Sedative • Zero Drowsiness
      </text>
      <text x="210" y="67" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">
        ✓ Belladonna • Spigelia • Gelsemium • Kali Phos • Baryta Carb
      </text>
    </g>
  </g>

  <!-- Bottom Quality Strip -->
  <g transform="translate(50, 655)">
    <rect width="500" height="95" rx="20" fill="url(#deepAmethyst)" filter="url(#neuroShadow)"/>
    <text x="40" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
      Non-Sedative Neurological Care
    </text>
    <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#DDD6FE">
      Addressing Vascular Spasms and Cognitive Clarity
    </text>
    <text x="40" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">
      ★ Zero Dependence • Gentle Pediatric Learning Protocols
    </text>
  </g>
</svg>
