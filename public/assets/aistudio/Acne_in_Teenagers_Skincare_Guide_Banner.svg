<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Sharp crisp drop shadow for orange pill container -->
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D95300" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean crisp background -->
  <rect width="1200" height="600" fill="#FFFFFF"/>

  <!-- Top and Bottom Solid Navy Blue Edge Bars -->
  <rect x="0" y="0" width="1200" height="20" fill="#0E3A75"/>
  <rect x="0" y="580" width="1200" height="20" fill="#0E3A75"/>

  <!-- ================= TOP-LEFT GEOMETRIC CLUSTER ================= -->
  <!-- Outer deep navy angled curved loop -->
  <path d="M -30,140 L 70,40 C 95,15 135,15 160,40 L 220,100 C 245,125 245,165 220,190 L 150,260" 
        fill="none" stroke="#0E3A75" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Secondary bright orange concentric curved track -->
  <path d="M -10,190 L 50,130 C 65,115 90,115 105,130 L 165,190 C 180,205 180,230 165,245 L 125,285" 
        fill="none" stroke="#FF7A00" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Thin cyan/blue inner contour track -->
  <path d="M 0,230 L 35,195 C 45,185 60,185 70,195 L 115,240 C 125,250 125,265 115,275 L 85,305" 
        fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>

  <!-- Corner concentric rounded rectangles & loop bands -->
  <rect x="18" y="24" width="70" height="70" rx="18" fill="none" stroke="#FF7A00" stroke-width="5" transform="rotate(-15 53 59)"/>
  <rect x="130" y="30" width="40" height="40" rx="10" fill="none" stroke="#0E3A75" stroke-width="4" transform="rotate(30 150 50)"/>

  <!-- Solid orange & navy dots -->
  <circle cx="85" cy="180" r="14" fill="#0E3A75"/>
  <circle cx="35" cy="355" r="12" fill="#FF7A00"/>
  <circle cx="15" cy="400" r="14" fill="#0E3A75"/>
  <circle cx="205" cy="115" r="7" fill="#FF7A00"/>
  <circle cx="230" cy="80" r="5" fill="#0E3A75"/>

  <!-- Matrix of small blue dots (top left) -->
  <g fill="#0E3A75">
    <circle cx="20" cy="470" r="3.5"/>
    <circle cx="32" cy="470" r="3.5"/>
    <circle cx="44" cy="470" r="3.5"/>
    <circle cx="20" cy="485" r="3.5"/>
    <circle cx="32" cy="485" r="3.5"/>
    <circle cx="44" cy="485" r="3.5"/>
    <circle cx="20" cy="500" r="3.5"/>
    <circle cx="32" cy="500" r="3.5"/>
    <circle cx="44" cy="500" r="3.5"/>
  </g>


  <!-- ================= TOP-RIGHT GEOMETRIC CLUSTER ================= -->
  <!-- Angled diagonal navy lines -->
  <line x1="990" y1="20" x2="1080" y2="110" stroke="#0E3A75" stroke-width="5" stroke-linecap="round"/>
  <line x1="1020" y1="20" x2="1110" y2="110" stroke="#0E3A75" stroke-width="3" stroke-linecap="round"/>

  <!-- Solid navy diamond with hollow frame -->
  <g transform="translate(1120, 80) rotate(45)">
    <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#0E3A75"/>
    <rect x="-38" y="-38" width="76" height="76" rx="14" fill="none" stroke="#0E3A75" stroke-width="4"/>
  </g>

  <!-- Orange rounded rectangular accent with hollow orange ring -->
  <rect x="1155" y="35" width="80" height="90" rx="20" fill="none" stroke="#FF7A00" stroke-width="12"/>
  <circle cx="1065" cy="130" r="14" fill="none" stroke="#FF7A00" stroke-width="6"/>
  <circle cx="1065" cy="130" r="5" fill="#FF7A00"/>

  <!-- Matrix of dots (top right) -->
  <g fill="#0E3A75">
    <circle cx="1160" cy="180" r="3.5"/>
    <circle cx="1172" cy="180" r="3.5"/>
    <circle cx="1184" cy="180" r="3.5"/>
    <circle cx="1160" cy="195" r="3.5"/>
    <circle cx="1172" cy="195" r="3.5"/>
    <circle cx="1184" cy="195" r="3.5"/>
    <circle cx="1160" cy="210" r="3.5"/>
    <circle cx="1172" cy="210" r="3.5"/>
    <circle cx="1184" cy="210" r="3.5"/>
  </g>


  <!-- ================= BOTTOM-LEFT GEOMETRIC CLUSTER ================= -->
  <!-- Layered diagonal angled tracks -->
  <path d="M 0,530 L 70,460 C 85,445 110,445 125,460 L 155,490" 
        fill="none" stroke="#0E3A75" stroke-width="10" stroke-linecap="round"/>
  <path d="M 0,570 L 105,465 C 125,445 155,445 175,465 L 210,500" 
        fill="none" stroke="#FF7A00" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Angled orange rounded square -->
  <rect x="95" y="515" width="38" height="38" rx="8" fill="none" stroke="#FF7A00" stroke-width="5" transform="rotate(45 114 534)"/>
  
  <!-- Subtle circuit icon contour at bottom corner -->
  <rect x="15" y="525" width="45" height="45" rx="10" fill="none" stroke="#0E3A75" stroke-width="4"/>
  <circle cx="37" cy="547" r="6" fill="#0E3A75"/>


  <!-- ================= BOTTOM-RIGHT GEOMETRIC CLUSTER ================= -->
  <!-- Large ascending navy diagonal track with rounded ends -->
  <path d="M 1220,440 L 1120,540 C 1105,555 1080,555 1065,540 L 980,455 C 960,435 930,435 910,455 L 890,475" 
        fill="none" stroke="#0E3A75" stroke-width="14" stroke-linecap="round"/>

  <!-- Vibrant orange parallel geometric arc -->
  <path d="M 1210,490 L 1150,550 C 1135,565 1110,565 1095,550 L 1040,495 C 1025,480 1000,480 985,495 L 965,515" 
        fill="none" stroke="#FF7A00" stroke-width="9" stroke-linecap="round"/>

  <!-- Solid orange & navy dots -->
  <circle cx="915" cy="425" r="14" fill="#0E3A75"/>
  <circle cx="880" cy="455" r="9" fill="#FF7A00"/>
  <circle cx="980" cy="555" r="12" fill="#FF7A00"/>
  <circle cx="1090" cy="390" r="10" fill="#FF7A00"/>

  <!-- Matrix of dots (bottom right) -->
  <g fill="#0E3A75">
    <circle cx="1140" cy="380" r="3.5"/>
    <circle cx="1152" cy="380" r="3.5"/>
    <circle cx="1164" cy="380" r="3.5"/>
    <circle cx="1176" cy="380" r="3.5"/>
    <circle cx="1140" cy="395" r="3.5"/>
    <circle cx="1152" cy="395" r="3.5"/>
    <circle cx="1164" cy="395" r="3.5"/>
    <circle cx="1176" cy="395" r="3.5"/>
    <circle cx="1140" cy="410" r="3.5"/>
    <circle cx="1152" cy="410" r="3.5"/>
    <circle cx="1164" cy="410" r="3.5"/>
    <circle cx="1176" cy="410" r="3.5"/>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Main Title: Acne in Teenagers: -->
  <text 
    x="600" 
    y="256" 
    text-anchor="middle" 
    font-family="'Playfair Display', Georgia, Cambria, 'Times New Roman', serif" 
    font-size="76" 
    font-weight="900" 
    font-style="italic" 
    fill="#0B2545" 
    letter-spacing="-0.5"
  >
    Acne in Teenagers:
  </text>

  <!-- Orange Capsule / Pill Container -->
  <rect 
    x="108" 
    y="296" 
    width="984" 
    height="136" 
    rx="68" 
    ry="68" 
    fill="#FF7A00"
    filter="url(#pillShadow)"
  />

  <!-- Subtitle Line 1: Understanding Hormonal Changes -->
  <text 
    x="600" 
    y="354" 
    text-anchor="middle" 
    font-family="'Playfair Display', Georgia, Cambria, 'Times New Roman', serif" 
    font-size="44" 
    font-weight="800" 
    font-style="italic" 
    fill="#FFFFFF" 
    letter-spacing="0.2"
  >
    Understanding Hormonal Changes
  </text>

  <!-- Subtitle Line 2: and Skin Care -->
  <text 
    x="600" 
    y="408" 
    text-anchor="middle" 
    font-family="'Playfair Display', Georgia, Cambria, 'Times New Roman', serif" 
    font-size="44" 
    font-weight="800" 
    font-style="italic" 
    fill="#FFFFFF" 
    letter-spacing="0.2"
  >
    and Skin Care
  </text>
</svg>
