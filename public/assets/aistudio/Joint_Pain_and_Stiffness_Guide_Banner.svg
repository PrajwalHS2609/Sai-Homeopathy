<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Crisp drop shadow for pill badge -->
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B1229" flood-opacity="0.25"/>
    </filter>
    <!-- Subtle drop shadow for geometric diamond tiles -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean crisp pure white background -->
  <rect width="1200" height="600" fill="#FFFFFF"/>

  <!-- ================= TOP-LEFT GEOMETRIC DIAMONDS CLUSTER ================= -->
  <g filter="url(#tileShadow)">
    <!-- Light grey backing tile -->
    <rect x="-80" y="40" width="160" height="160" rx="24" fill="#E2E8F0" transform="rotate(45 0 120)"/>
    <!-- Deep charcoal slate tile -->
    <rect x="30" y="-70" width="170" height="170" rx="26" fill="#1E252D" transform="rotate(45 115 15)"/>
    <!-- Rich burgundy tile -->
    <rect x="140" y="-10" width="150" height="150" rx="22" fill="#751322" transform="rotate(45 215 65)"/>
    <!-- Vibrant crimson red tile -->
    <rect x="-30" y="80" width="160" height="160" rx="24" fill="#C81429" transform="rotate(45 50 160)"/>
    <!-- Soft silver accent tile -->
    <rect x="80" y="110" width="120" height="120" rx="20" fill="#CBD5E1" transform="rotate(45 140 170)"/>
    <!-- Deep slate corner anchor -->
    <rect x="-110" y="-50" width="150" height="150" rx="24" fill="#1E252D" transform="rotate(45 -35 25)"/>
    <!-- Secondary crimson pop -->
    <rect x="-60" y="190" width="140" height="140" rx="22" fill="#8B1229" transform="rotate(45 10 260)"/>
  </g>

  <!-- ================= BOTTOM-LEFT GEOMETRIC DIAMONDS CLUSTER ================= -->
  <g filter="url(#tileShadow)">
    <!-- Soft light grey tile -->
    <rect x="-60" y="450" width="150" height="150" rx="24" fill="#E2E8F0" transform="rotate(45 15 525)"/>
    <!-- Deep charcoal tile -->
    <rect x="80" y="490" width="150" height="150" rx="24" fill="#1E252D" transform="rotate(45 155 565)"/>
    <!-- Crimson red tile -->
    <rect x="220" y="530" width="140" height="140" rx="22" fill="#C81429" transform="rotate(45 290 600)"/>
    <!-- Small deep wine accent -->
    <rect x="-20" y="380" width="110" height="110" rx="18" fill="#751322" transform="rotate(45 35 435)"/>
  </g>

  <!-- ================= BOTTOM-RIGHT GEOMETRIC DIAMONDS CLUSTER ================= -->
  <g filter="url(#tileShadow)">
    <!-- Soft grey background tile -->
    <rect x="860" y="420" width="160" height="160" rx="24" fill="#CBD5E1" transform="rotate(45 940 500)"/>
    <!-- Crimson tile left edge -->
    <rect x="740" y="520" width="160" height="160" rx="24" fill="#C81429" transform="rotate(45 820 600)"/>
    <!-- Deep wine tile -->
    <rect x="910" y="490" width="170" height="170" rx="26" fill="#751322" transform="rotate(45 995 575)"/>
    <!-- Deep charcoal anchor tile -->
    <rect x="1010" y="370" width="170" height="170" rx="26" fill="#1E252D" transform="rotate(45 1095 455)"/>
    <!-- Foreground vibrant crimson tile -->
    <rect x="920" y="340" width="140" height="140" rx="22" fill="#D9162E" transform="rotate(45 990 410)"/>
    <!-- Outer corner deep charcoal -->
    <rect x="1100" y="470" width="180" height="180" rx="26" fill="#1E252D" transform="rotate(45 1190 560)"/>
    <!-- Far right crimson edge -->
    <rect x="1110" y="270" width="150" height="150" rx="22" fill="#C81429" transform="rotate(45 1185 345)"/>
    <!-- Accent soft grey tile -->
    <rect x="1040" y="230" width="110" height="110" rx="18" fill="#E2E8F0" transform="rotate(45 1095 285)"/>
  </g>

  <!-- ================= CENTRAL TYPOGRAPHY & PILL BADGE ================= -->
  <!-- Main Title: Joint Pain and Stiffness: -->
  <text x="600" y="265" text-anchor="middle" 
        font-family="'Playfair Display', 'DejaVu Serif', 'Liberation Serif', 'Georgia', serif" 
        font-size="68" font-weight="900" font-style="italic" 
        fill="#751322" letter-spacing="-0.5">
    Joint Pain and Stiffness:
  </text>

  <!-- Subtitle Pill Container -->
  <g filter="url(#pillShadow)">
    <rect x="140" y="315" width="920" height="76" rx="38" fill="#C81429"/>
  </g>

  <!-- Subtitle Text inside Pill -->
  <text x="600" y="367" text-anchor="middle" 
        font-family="'Playfair Display', 'DejaVu Serif', 'Liberation Serif', 'Georgia', serif" 
        font-size="40" font-weight="700" font-style="italic" 
        fill="#FFFFFF" letter-spacing="0.2">
    Common Causes and When to Seek Help
  </text>
</svg>
